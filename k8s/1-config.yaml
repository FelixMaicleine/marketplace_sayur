apiVersion: v1
kind: ConfigMap
metadata:
  name: sayur-config
data:
  DB_HOST: "mysql-service"
  DB_USER: "root"
  DB_NAME: "db_sayur"
---
apiVersion: v1
kind: Secret
metadata:
  name: sayur-secret
type: Opaque
stringData:
  DB_PASSWORD: "123456" # Sesuaikan dengan docker-compose.prod.yml kamu
  MYSQL_ROOT_PASSWORD: "123456"
  JWT_SECRET: "supersecretkey"